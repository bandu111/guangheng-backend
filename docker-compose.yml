services:
  guangheng-api:
    image: guangheng-server:1.6.0
    container_name: guangheng-api
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "false"
    volumes:
      - ./storage:/app/storage
      - ./models:/home/guangheng/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  guangheng-mcp:
    image: guangheng-server:1.6.0
    container_name: guangheng-mcp
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.modules.hermes.mcp.server", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8001), 3); s.close()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
